name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest

    # The property listing tests exercise the real query path rather than a
    # stub, so the suite needs a live PostgreSQL to run against.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: syria_real_estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Throwaway values. Configuration is parsed at import time, so the server
      # suite needs every required variable present — none of them is a secret
      # and none points at a real service.
      CORS_ORIGINS: https://example.com
      DATABASE_URL: postgresql://ci:ci@localhost:5432/syria_real_estate_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/syria_real_estate_test
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_value
      SUPABASE_STORAGE_BUCKET: ci-bucket

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lockfile was written on Windows, so it carries only the win32
      # rolldown binding. npm's optional-dependency handling leaves the Linux
      # one out of `npm ci`, and Vite cannot build without it.
      - name: Install rolldown native binding
        run: npm install "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")" --no-save

      - name: Lint
        run: npm run lint:client

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace server

      - name: Server test suite
        run: npm run test:server
        env:
          NODE_ENV: test

      - name: Client test suite
        run: npm run test:client
