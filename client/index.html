<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12243B" />
    <!-- Declares that the page paints its own light and dark appearance, so
         browsers with a forced dark mode (Samsung Internet, Chrome) never
         auto-invert the palette into a second, unbranded rendering. -->
    <meta name="color-scheme" content="light dark" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to the
         real notch/home-indicator insets used by the fixed bottom bar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Discover homes for sale, for rent, and short stays across every Syrian governorate."
    />
    <script>
      ;(() => {
        const localeStorageKey = 'dar-syria-locale'
        const supportedLocales = {
          ar: 'rtl',
          en: 'ltr',
          de: 'ltr',
        }

        try {
          const storedLocale = localStorage.getItem(localeStorageKey)
          if (storedLocale && supportedLocales[storedLocale]) {
            document.documentElement.lang = storedLocale
            document.documentElement.dir = supportedLocales[storedLocale]
          }
        } catch {
          // Storage can be unavailable in privacy-restricted environments.
        }

        /* The single theme mechanism: a stored choice wins, otherwise the
           system preference decides, and the result is written as the `dark`
           class on <html> before the first paint. Nothing else — no media
           query in CSS, no second palette — may set the appearance. */
        const storageKey = 'dar-syria-theme'
        let storedTheme = null

        try {
          const storedPreference = localStorage.getItem(storageKey)
          if (storedPreference === 'light' || storedPreference === 'dark') {
            storedTheme = storedPreference
          }
        } catch {
          // Storage can be unavailable in privacy-restricted environments.
        }

        const resolvedTheme =
          storedTheme ??
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light')

        document.documentElement.classList.toggle(
          'dark',
          resolvedTheme === 'dark',
        )
      })()
    </script>
    <title>Properties in Syria | Property for Sale and Rent in Syria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
